name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  # Added pull_request so you can block vulnerable code before it merges to main
  pull_request:
    branches: [main]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security scan with Bandit
        run: |
          pip install bandit
          # Generate the full JSON report without failing the pipeline yet
          bandit -r app/ -f json -o bandit-report.json || true
          
          echo "=== Checking for HIGH severity vulnerabilities ==="
          # The -ll flag ensures Bandit natively fails with an exit code 1 if HIGH issues are found
          bandit -r app/ -ll
          
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always() # Ensures the report uploads even if the previous step fails
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}

      - name: Build Docker image
        run: docker build -t devsecops-app -f docker/Dockerfile .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          exit-code: '1' # Changed to 1: This will STOP the pipeline if issues are found
          severity: CRITICAL,HIGH

      # The following steps will ONLY run if Bandit and Trivy find no HIGH/CRITICAL vulnerabilities
      - name: Push to ECR
        run: |
          docker tag devsecops-app:latest ${{ secrets.ECR_REPOSITORY }}:latest
          docker push ${{ secrets.ECR_REPOSITORY }}:latest

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name devsecops-cluster
          kubectl apply -f k8s/
          kubectl rollout restart deployment/devsecops-app
          kubectl rollout status deployment/devsecops-app --timeout=300s
